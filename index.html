<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Villain Hackers</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --accent: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.25rem;
      margin-bottom: 12px;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background-color: var(--accent);
      color: #000;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.9;
    }

    footer {
      margin-top: 40px;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">Online</span>
    <h1>Villain Hackers</h1>
    <p>Welcome to villainhackers.com. Our GitHub Pages site is successfully up and running.</p>
    <a href="https://github.com/villainhackers-pcs" class="btn" target="_blank" rel="noopener noreferrer">View GitHub Profile</a>
  </div>

  <footer>
    &copy; 2026 Villain Hackers. All rights reserved.
  </footer>

</body>
</html>
