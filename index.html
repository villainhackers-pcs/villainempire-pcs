<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Villain Hackers</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 32px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 16px;
    }

    p {
      color: var(--text-muted);
      font-size: 1.125rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      background-color: var(--accent);
      color: #000;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 48px;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="status-badge">
      <span class="status-dot"></span> Domain Verified
    </div>
    
    <h1>Villain Hackers</h1>
    <p>Welcome to <strong>villainhackers.com</strong>. Our GitHub Pages domain setup is complete and our official site is online.</p>
    
    <a href="https://github.com/villainhackers-pcs" class="btn" target="_blank" rel="noopener noreferrer">
      Visit GitHub Profile
    </a>
  </main>

  <footer>
    &copy; 2026 Villain Hackers. All rights reserved.
  </footer>

</body>
</html>
